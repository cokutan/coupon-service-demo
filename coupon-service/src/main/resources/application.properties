spring.application.name=coupon-service
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# JDBC Batching for bulk uploads
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

server.tomcat.max-threads=200

# Redisson configuration
spring.redisson.address=redis://${SPRING_REDIS_HOST:localhost}:${SPRING_REDIS_PORT:6379}

# Application-specific properties
coupon.upload.max-batch-size=50000

# Actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.logfile.external-file=logs/coupon-service.log
logging.file.name=logs/coupon-service.log
logging.level.com.onepin.couponservice=DEBUG

# Springdoc OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=Coupon Management System API
springdoc.info.description=RESTful APIs for loading, providing, and recording coupons.
springdoc.info.version=v1.0.0

# MEGADEAL Configuration
megadeal.concurrent-limit=5
megadeal.rate-limit=10
megadeal.rate-limit-seconds=1
megadeal.wait-timeout-seconds=10
