# --- Redis (values injected dynamically by Testcontainers) ---
spring.redis.host=localhost
spring.redis.port=6379

# --- Redisson ---
redisson.singleServerConfig.address=redis://${spring.redis.host}:${spring.redis.port}

# --- Test-specific tweaks ---
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.com.onepin.couponservice=DEBUG
